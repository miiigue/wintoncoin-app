<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Momentum — WintonCoin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="momentum-dashboard.css">
    <link rel="icon" href="assets/icons/favicon.ico">
    <style>
        /* ============================================================================
         * Estilos adicionales exclusivos del admin (extendiendo momentum-dashboard.css)
         * ============================================================================ */

        /* --- Admin Navigation Tabs --- */
        .mma-tabs {
            display: flex;
            gap: 4px;
            background: var(--mm-bg-secondary);
            padding: 4px;
            border-radius: var(--mm-radius);
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .mma-tab {
            padding: 10px 18px;
            border: none;
            background: transparent;
            color: var(--mm-text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            font-family: var(--mm-font);
            border-radius: 8px;
            cursor: pointer;
            transition: var(--mm-transition);
        }

        .mma-tab:hover {
            color: var(--mm-text-primary);
            background: var(--mm-bg-card);
        }

        .mma-tab.--active {
            background: var(--mm-bg-card);
            color: var(--mm-gold);
            box-shadow: 0 0 12px var(--mm-gold-glow);
        }

        /* --- Config Panel --- */
        .mma-config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .mma-config-card {
            background: var(--mm-bg-card);
            border: 1px solid var(--mm-border);
            border-radius: var(--mm-radius);
            padding: 20px;
        }

        .mma-config-card label {
            display: block;
            font-size: 0.75rem;
            color: var(--mm-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .mma-config-card input {
            width: 100%;
            padding: 10px 14px;
            background: var(--mm-bg-primary);
            border: 1px solid var(--mm-border);
            border-radius: 8px;
            color: var(--mm-text-primary);
            font-size: 1rem;
            font-family: var(--mm-font);
            outline: none;
            transition: var(--mm-transition);
        }

        .mma-config-card input:focus {
            border-color: var(--mm-gold-dim);
            box-shadow: 0 0 0 3px var(--mm-gold-glow);
        }

        /* --- Admin Table --- */
        .mma-table-wrap {
            overflow-x: auto;
            margin-bottom: 24px;
        }

        .mma-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .mma-table th {
            text-align: left;
            padding: 12px 16px;
            background: var(--mm-bg-secondary);
            color: var(--mm-text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.7rem;
            border-bottom: 1px solid var(--mm-border);
        }

        .mma-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--mm-border);
            vertical-align: middle;
        }

        .mma-table tr:hover td {
            background: var(--mm-bg-card-hover);
        }

        /* --- Tier Select --- */
        .mma-tier-select {
            padding: 6px 10px;
            background: var(--mm-bg-primary);
            border: 1px solid var(--mm-border);
            border-radius: 6px;
            color: var(--mm-text-primary);
            font-size: 0.8rem;
            font-family: var(--mm-font);
            cursor: pointer;
        }

        /* --- Campaign Create Form --- */
        .mma-create-form {
            background: var(--mm-bg-card);
            border: 1px solid var(--mm-border);
            border-radius: var(--mm-radius-lg);
            padding: 24px;
            margin-bottom: 24px;
        }

        .mma-create-form h4 {
            font-size: 1rem;
            margin-bottom: 16px;
            color: var(--mm-gold);
        }

        .mma-form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }

        .mma-form-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .mma-form-field label {
            font-size: 0.7rem;
            color: var(--mm-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .mma-form-field input,
        .mma-form-field textarea {
            padding: 10px 14px;
            background: var(--mm-bg-primary);
            border: 1px solid var(--mm-border);
            border-radius: 8px;
            color: var(--mm-text-primary);
            font-size: 0.9rem;
            font-family: var(--mm-font);
            outline: none;
            transition: var(--mm-transition);
        }

        .mma-form-field input:focus,
        .mma-form-field textarea:focus {
            border-color: var(--mm-gold-dim);
            box-shadow: 0 0 0 3px var(--mm-gold-glow);
        }

        /* --- Verification Card --- */
        .mma-verify-card {
            background: var(--mm-bg-card);
            border: 1px solid var(--mm-border);
            border-radius: var(--mm-radius);
            padding: 20px;
            margin-bottom: 12px;
            transition: var(--mm-transition);
        }

        .mma-verify-card:hover {
            border-color: var(--mm-border-glow);
        }

        .mma-verify-card__header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .mma-verify-card__user {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .mma-verify-card__campaign {
            font-size: 0.85rem;
            color: var(--mm-text-secondary);
        }

        .mma-verify-card__link {
            display: inline-block;
            color: var(--mm-blue);
            font-size: 0.85rem;
            word-break: break-all;
            margin: 8px 0;
        }

        .mma-verify-card__link:hover {
            text-decoration: underline;
        }

        .mma-verify-card__actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .mma-verify-card__actions input {
            flex: 1;
            min-width: 150px;
            padding: 8px 12px;
            background: var(--mm-bg-primary);
            border: 1px solid var(--mm-border);
            border-radius: 6px;
            color: var(--mm-text-primary);
            font-size: 0.85rem;
            font-family: var(--mm-font);
        }

        /* --- Stats Row --- */
        .mma-stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .mma-stat-card {
            background: var(--mm-bg-card);
            border: 1px solid var(--mm-border);
            border-radius: var(--mm-radius);
            padding: 16px;
            text-align: center;
        }

        .mma-stat-card__value {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--mm-gold);
        }

        .mma-stat-card__label {
            font-size: 0.7rem;
            color: var(--mm-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        /* --- Section Panel --- */
        .mma-panel {
            display: none;
        }

        .mma-panel.--active {
            display: block;
        }
    </style>
</head>

<body class="momentum-dashboard">

    <!-- ========== HEADER ========== -->
    <header class="mmd-header">
        <div class="mmd-header__left">
            <span class="mmd-header__logo">⚡ Momentum Admin</span>
        </div>
        <div class="mmd-header__right">
            <a href="admin-panel.html" class="mmd-header__back">← Admin Panel</a>
        </div>
    </header>

    <main class="mmd-container">
        <!-- Admin Tabs -->
        <nav class="mma-tabs" id="mma-tabs">
            <button class="mma-tab --active" data-panel="config">⚙️ Config Global</button>
            <button class="mma-tab" data-panel="applicants">📋 Postulantes</button>
            <button class="mma-tab" data-panel="profiles">👥 Influencers</button>
            <button class="mma-tab" data-panel="campaigns">🎯 Campañas</button>
            <button class="mma-tab" data-panel="verify">✅ Verificar Entregas</button>
        </nav>

        <!-- ========== CONFIG PANEL ========== -->
        <div class="mma-panel --active" id="mma-panel-config">
            <h3 class="mmd-section-title">Configuración Global</h3>
            <div class="mma-config-grid" id="mma-config-grid">
                <div class="mma-config-card">
                    <label>Multiplicador Vigente</label>
                    <input type="number" id="mma-cfg-multiplier" step="0.01" min="1">
                </div>
                <div class="mma-config-card">
                    <label>Nombre de Fase</label>
                    <input type="text" id="mma-cfg-phase" maxlength="100">
                </div>
                <div class="mma-config-card">
                    <label>Cupos Totales</label>
                    <input type="number" id="mma-cfg-total-slots" min="0">
                </div>
                <div class="mma-config-card">
                    <label>Cupos Ocupados</label>
                    <input type="number" id="mma-cfg-occupied" min="0">
                </div>
                <div class="mma-config-card">
                    <label>Fecha Fin de Fase</label>
                    <input type="datetime-local" id="mma-cfg-end-date">
                </div>
            </div>
            <button class="mmd-btn mmd-btn--gold" id="mma-save-config">💾 Guardar Configuración</button>
        </div>

        <!-- ========== APPLICANTS PANEL ========== -->
        <div class="mma-panel" id="mma-panel-applicants">
            <h3 class="mmd-section-title">Postulantes Pendientes</h3>
            <div id="mma-applicants-list"></div>
        </div>

        <!-- ========== PROFILES PANEL ========== -->
        <div class="mma-panel" id="mma-panel-profiles">
            <h3 class="mmd-section-title">Influencers Activos</h3>
            <div id="mma-profiles-list"></div>
        </div>

        <!-- ========== CAMPAIGNS PANEL ========== -->
        <div class="mma-panel" id="mma-panel-campaigns">
            <h3 class="mmd-section-title">Campañas</h3>

            <!-- Formulario de creación -->
            <div class="mma-create-form" id="mma-create-campaign-form">
                <h4>➕ Nueva Campaña</h4>
                <div class="mma-form-row">
                    <div class="mma-form-field" style="grid-column: 1 / span 2;">
                        <label>Título</label>
                        <input type="text" id="mma-camp-title" placeholder="Título de la misión" required>
                    </div>
                    <div class="mma-form-field"
                        style="display: flex; flex-direction: row; align-items: center; gap: 10px; padding-top: 24px;">
                        <input type="checkbox" id="mma-camp-multiple"
                            style="width: 20px; height: 20px; cursor: pointer;">
                        <label for="mma-camp-multiple" style="margin-bottom: 0; cursor: pointer;">Misión
                            Repetible</label>
                    </div>
                </div>
                <div class="mma-form-row">
                    <div class="mma-form-field" style="grid-column: 1 / -1;">
                        <label>Descripción / Instrucciones</label>
                        <textarea id="mma-camp-desc" rows="3"
                            placeholder="Describe qué debe hacer el influencer..."></textarea>
                    </div>
                </div>
                <div class="mma-form-row">
                    <div class="mma-form-field">
                        <label>👀 Base Visionario</label>
                        <input type="number" id="mma-camp-visionario" step="0.01" min="0" placeholder="100">
                    </div>
                    <div class="mma-form-field">
                        <label>🥉 Base Bronce</label>
                        <input type="number" id="mma-camp-bronce" step="0.01" min="0" placeholder="333">
                    </div>
                    <div class="mma-form-field">
                        <label>🥈 Base Plata</label>
                        <input type="number" id="mma-camp-plata" step="0.01" min="0" placeholder="666">
                    </div>
                    <div class="mma-form-field">
                        <label>🥇 Base Oro</label>
                        <input type="number" id="mma-camp-oro" step="0.01" min="0" placeholder="1000">
                    </div>
                    <div class="mma-form-field">
                        <label>💎 Base Platino</label>
                        <input type="number" id="mma-camp-platino" step="0.01" min="0" placeholder="2000">
                    </div>
                </div>
                <button class="mmd-btn mmd-btn--gold" id="mma-create-campaign-btn" style="margin-top: 12px;">🚀 Crear
                    Campaña</button>
            </div>

            <!-- Lista de campañas existentes -->
            <div id="mma-campaigns-list"></div>
        </div>

        <!-- ========== VERIFY PANEL ========== -->
        <div class="mma-panel" id="mma-panel-verify">
            <h3 class="mmd-section-title">Entregas Pendientes de Verificación</h3>
            <div id="mma-verify-list"></div>
        </div>
    </main>

    <!-- Modales de Alerta y Confirmación Personalizados -->
    <div id="customAlertModal" class="modal">
        <div class="modal-content">
            <span class="close-button alert-close-button">&times;</span>
            <p id="customAlertMessage"></p>
            <button class="action-button alert-close-button">Cerrar</button>
        </div>
    </div>
    <div id="customConfirmModal" class="modal">
        <div class="modal-content">
            <span class="close-button confirm-close-button">&times;</span>
            <p id="customConfirmMessage"></p>
            <div class="confirm-buttons">
                <button class="action-button cancel-button">Cancelar</button>
                <button class="action-button confirm-button">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="mmd-toast" id="mmd-toast"></div>

    <script type="module" src="src/pages/momentum-admin.js"></script>
</body>

</html>
