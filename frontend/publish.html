<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Publicación - Interfaz Smart Contract</title>
    <link id="main-stylesheet" rel="stylesheet" href="style.css">
    <script>document.getElementById('main-stylesheet').href = `style.css?v=${new Date().getTime()}`;</script>
</head>
<body>
    <div class="container">
        <h1>Crear Nueva Publicación</h1>
        <h2>Comparte algo nuevo con la comunidad.</h2>
        
        <form id="publishForm">
            <div>
                <label for="title">Título:</label>
                <input type="text" id="title" name="title" required placeholder="Ej: Necesito un logo para mi marca">
                <small class="input-hint">Un título corto y descriptivo que resuma la tarea.</small>
            </div>

            <div>
                <label for="description">Descripción:</label>
                <textarea id="description" name="description" rows="4" required placeholder="Ej: Busco un diseñador para crear un logo moderno y minimalista para mi startup. Los colores principales deben ser azul y blanco..."></textarea>
                <small class="input-hint">Detalla aquí los requisitos, el alcance y cualquier otra información relevante.</small>
            </div>
            
            <div id="cost-wrapper">
                <label for="blueCost">Recompensa (en BLUE):</label>
                <input type="text" inputmode="decimal" id="blueCost" name="blueCost" placeholder="Ej: 12.53" pattern="^[0-9]+([.,][0-9]{1,4})?$">
            </div>

            <div id="sell-wrapper">
                <label for="blueSell">Precio de Venta (en BLUE):</label>
                <input type="text" inputmode="decimal" id="blueSell" name="blueSell" placeholder="Ej: 50.00" pattern="^[0-9]+([.,][0-9]{1,4})?$">
            </div>

            <div>
                <label for="availableSlots">Cupos Disponibles (cuántas personas pueden aceptar):</label>
                <input type="number" id="availableSlots" name="availableSlots" min="1" value="1">
            </div>

            <!-- Contenedor para la nota de la comisión -->
            <div id="commission-notice-container"></div>
            
            <div>
                <button type="submit">Publicar</button>
            </div>
        </form>
        <p><a href="contract_interaction.html">Volver al panel principal</a></p>
    </div>

    <script src="utils.js"></script>
    <script src="publish.js"></script>

    <!-- Modal de Alerta Personalizado -->
    <div id="customAlertModal" class="modal">
        <div class="modal-content">
            <span class="close-button alert-close-button">&times;</span>
            <p id="customAlertMessage"></p>
            <button class="action-button alert-close-button">Cerrar</button>
        </div>
    </div>
</body>
</html>
