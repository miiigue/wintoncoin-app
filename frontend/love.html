<!DOCTYPE html>
<html lang="es">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <a href="contract_interaction.html" class="back-link">← Volver</a>

    <main class="love-main">
        <section id="love-section" class="love-card">

            <p>Esta es una lista pública de todos los usuarios con deudas de tokens RED que han sido penalizadas y aún no se han saldado.</p>

                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Deuda Vencida (RED)</th>
                            <th>Vencido Desde</th>
                            <th>Reincidencias</th>

                    </thead>
                    <tbody id="love-table-body">
                        <!-- Las filas se insertarán aquí dinámicamente -->

                </table>

        </section>
