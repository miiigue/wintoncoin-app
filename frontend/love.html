<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Página L.O.V.</title>
    <link rel="stylesheet" href="style.css"> <!-- Reutilizamos los estilos principales -->
</head>
<body class="love-page">
    <header class="love-header">
        <a href="contract_interaction.html" class="back-link">← Volver</a>
        <h1>Página L.O.V.</h1>
    </header>

    <main class="love-main">
        <section id="love-section" class="love-card">
            <h2>Lista de Obligaciones Vencidas</h2>
            <p>Esta es una lista pública de todos los usuarios con compromisos de tokens RED que se encuentran pendientes por mora y aún no se han amortizado.</p>
            
            <div id="loading" class="loading-spinner" style="display: none;"></div>
            
            <div class="table-container love-table-container">
                <table class="love-table">
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Compromiso Vencido (RED)</th>
                            <th>Vencido Desde</th>
                            <th>Reincidencias</th>
                        </tr>
                    </thead>
                    <tbody id="love-table-body">
                        <!-- Las filas se insertarán aquí dinámicamente -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- ES Modules (Vite) -->
    <script type="module" src="src/pages/love.js"></script>
</body>
</html>
