<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Acceso de Administrador - Winton Coin</title>
    <link id="main-stylesheet" rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Panel de Administración</h1>
        <h2>Acceso Restringido</h2>

        <form id="adminLoginForm">
            <div>
                <label for="adminUsername">Usuario de Administrador:</label>
                <input type="text" id="adminUsername" name="adminUsername" required placeholder="Ej: admin" autocomplete="username">
            </div>
            <div>
                <label for="adminPassword">Contraseña de Administrador:</label>
                <input type="password" id="adminPassword" name="adminPassword" required autocomplete="current-password">
            </div>
            
            <div>
                <button type="submit">Ingresar</button>
            </div>
        </form>
        <p><a href="index.html">Volver a la página principal</a></p>
    </div>

    <!-- ES Modules (Vite) -->
    <script type="module" src="src/pages/admin-login.js"></script>

    <div id="customAlertModal" class="modal">
        <div class="modal-content">
            <span class="close-button alert-close-button">&times;</span>
            <p id="customAlertMessage"></p>
            <button class="action-button alert-close-button">Cerrar</button>
        </div>
    </div>
</body>
</html>
