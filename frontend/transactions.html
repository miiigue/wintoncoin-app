<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>Historial de Transacciones - Winton Coin</title>

    <!-- Guard Inmediato de Autenticación: Si no hay sesión activa, redirige a login antes de renderizar -->
    <script>
        (function() {
            var token = localStorage.getItem('token');
            var username = localStorage.getItem('username');
            if (!token && !username) {
                var returnTo = encodeURIComponent(window.location.pathname + window.location.search);
                window.location.replace('/login.html?returnTo=' + returnTo);
            }
        })();
    </script>
    <link id="main-stylesheet" rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <a href="contract_interaction.html" class="back-link">&larr; Volver</a>
        
        <h1>Historial de Transacciones</h1>
        <p class="subtitle" id="transactionsUsername">Transacciones para ...</p>

        <div class="table-container">
            <table id="transactions-table">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Descripción</th>
                        <th>BLUE</th>
                        <th>RED</th>
                    </tr>
                </thead>
                <tbody id="transactions-table-body">
                    <!-- Las filas de transacciones se insertarán aquí -->
                </tbody>
            </table>
        </div>
        <p id="no-transactions-message" style="display: none;">No tienes ninguna transacción todavía.</p>
    </div>

    <!-- ES Modules (Vite) -->
    <script type="module" src="src/pages/transactions.js"></script>

    <!-- Modal de Alerta Personalizado -->
    <div id="customAlertModal" class="modal">
        <div class="modal-content">
            <span class="close-button alert-close-button">&times;</span>
            <p id="customAlertMessage"></p>
            <button class="action-button alert-close-button">Cerrar</button>
        </div>
    </div>
</body>
</html>
