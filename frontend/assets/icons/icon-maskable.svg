<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="wGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFA500"/>
      <stop offset="100%" style="stop-color:#FF8C00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- FONDO BLANCO S�LIDO - Importante para Android -->
  <rect x="0" y="0" width="512" height="512" fill="#ffffff"/>
  
  <!-- C�rculo del logo - reducido al 80% para zona segura de maskable -->
  <circle cx="256" cy="256" r="200" fill="url(#bgGrad)"/>
  
  <!-- Inner circle for depth -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  
  <!-- W letter - escalada para zona segura -->
  <g filter="url(#shadow)" transform="translate(256, 256) scale(0.78) translate(-256, -256)">
    <path d="M 100 140 
             L 150 140 
             L 190 320 
             L 256 200 
             L 322 320 
             L 362 140 
             L 412 140 
             L 340 380 
             L 290 380 
             L 256 290 
             L 222 380 
             L 172 380 
             Z" 
          fill="url(#wGrad)"/>
  </g>
  
  <!-- Subtle shine effect -->
  <ellipse cx="256" cy="160" rx="120" ry="60" fill="rgba(255,255,255,0.03)"/>
</svg>
