<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Iconos PWA - WintonCoin</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #fff;
        }
        h1 { color: #4a90d9; }
        .icon-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
        }
        .icon-item {
            text-align: center;
            background: #16213e;
            padding: 15px;
            border-radius: 8px;
        }
        .icon-item img, .icon-item canvas {
            border-radius: 20%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .icon-item p {
            margin: 10px 0 0;
            font-size: 12px;
            color: #888;
        }
        button {
            background: linear-gradient(135deg, #4a90d9 0%, #357abd 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        button:hover { opacity: 0.9; }
        #status {
            margin: 20px 0;
            padding: 15px;
            background: #16213e;
            border-radius: 6px;
        }
        .success { color: #4CAF50; }
        .info { color: #4a90d9; }
    </style>
</head>
<body>
    <h1>🎨 Generador de Iconos PWA</h1>
    <p>Esta herramienta genera todos los tamaños de iconos necesarios para la PWA de WintonCoin.</p>
    
    <h2>1. Cargar imagen base (opcional)</h2>
    <p>Puedes usar el SVG incluido o cargar tu propio logo (PNG o SVG, mínimo 512x512):</p>
    <input type="file" id="customIcon" accept="image/*">
    
    <h2>2. Vista previa</h2>
    <div class="icon-preview" id="preview"></div>
    
    <h2>3. Generar y descargar</h2>
    <button onclick="generateAllIcons()">📦 Generar Todos los Iconos</button>
    <button onclick="downloadAll()">💾 Descargar ZIP</button>
    
    <div id="status"></div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const maskableSizes = [192, 512];
        let baseImage = null;
        
        // Cargar SVG por defecto
        async function loadDefaultSVG() {
            const response = await fetch('icon.svg');
            const svgText = await response.text();
            const blob = new Blob([svgText], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            
            const img = new Image();
            img.onload = () => {
                baseImage = img;
                updatePreview();
            };
            img.src = url;
        }
        
        // Cargar imagen personalizada
        document.getElementById('customIcon').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    baseImage = img;
                    updatePreview();
                    log('Imagen personalizada cargada: ' + file.name, 'success');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
        
        function updatePreview() {
            const preview = document.getElementById('preview');
            preview.innerHTML = '';
            
            [512, 192, 96].forEach(size => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                
                ctx.drawImage(baseImage, 0, 0, size, size);
                
                const item = document.createElement('div');
                item.className = 'icon-item';
                item.appendChild(canvas);
                item.innerHTML += `<p>${size}x${size}</p>`;
                preview.appendChild(item);
            });
        }
        
        async function generateAllIcons() {
            if (!baseImage) {
                log('Cargando imagen base...', 'info');
                await loadDefaultSVG();
            }
            
            log('Generando iconos...', 'info');
            
            // Generar iconos normales
            for (const size of sizes) {
                await generateIcon(size, false);
            }
            
            // Generar iconos maskable (con padding)
            for (const size of maskableSizes) {
                await generateIcon(size, true);
            }
            
            log('✅ Todos los iconos generados. Haz clic en "Descargar ZIP" para guardarlos.', 'success');
        }
        
        function generateIcon(size, maskable = false) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                
                if (maskable) {
                    // Para maskable: FONDO BLANCO SÓLIDO + padding del 10%
                    // Esto es crítico para que no aparezcan bordes negros en Android
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, size, size);
                    
                    const padding = size * 0.1;
                    const innerSize = size - (padding * 2);
                    ctx.drawImage(baseImage, padding, padding, innerSize, innerSize);
                } else {
                    ctx.drawImage(baseImage, 0, 0, size, size);
                }
                
                const filename = maskable 
                    ? `icon-maskable-${size}x${size}.png`
                    : `icon-${size}x${size}.png`;
                
                canvas.toBlob((blob) => {
                    // Guardar para descarga
                    window.generatedIcons = window.generatedIcons || {};
                    window.generatedIcons[filename] = blob;
                    resolve();
                }, 'image/png');
            });
        }
        
        async function downloadAll() {
            if (!window.generatedIcons || Object.keys(window.generatedIcons).length === 0) {
                await generateAllIcons();
            }
            
            // Descargar cada archivo individualmente (sin ZIP library)
            log('Descargando iconos...', 'info');
            
            for (const [filename, blob] of Object.entries(window.generatedIcons)) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
                
                // Pequeña pausa entre descargas
                await new Promise(r => setTimeout(r, 200));
            }
            
            log('✅ Descarga completada. Mueve los archivos a frontend/assets/icons/', 'success');
        }
        
        function log(message, type = 'info') {
            const status = document.getElementById('status');
            status.innerHTML = `<p class="${type}">${message}</p>` + status.innerHTML;
        }
        
        // Inicializar
        loadDefaultSVG();
    </script>
</body>
</html>
