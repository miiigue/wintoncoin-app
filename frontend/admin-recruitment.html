<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winton Talent - Panel de Reclutamiento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ============================================================ */
        /* ESTILOS DEL PANEL DE RECLUTAMIENTO - WINTON TALENT           */
        /* Diseño Sapphire Premium con paleta corporativa               */
        /* ============================================================ */
        :root {
            --talent-primary: #3B82F6;
            --talent-glow: rgba(59, 130, 246, 0.2);
            --talent-success: #22C55E;
            --talent-warning: #F59E0B;
            --talent-danger: #EF4444;
            --talent-info: #6366F1;
        }

        body {
            background: #05050A;
            color: #E2E8F0;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Barra superior con navegación */
        .talent-topbar {
            background: rgba(15, 15, 30, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .talent-topbar h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            margin: 0;
            background: linear-gradient(135deg, #60A5FA, #2563EB);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .talent-topbar .back-btn {
            color: #94A3B8;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            transition: all 0.3s;
        }

        .talent-topbar .back-btn:hover {
            color: white;
            border-color: var(--talent-primary);
        }

        /* Contenedor principal */
        .talent-main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* Tarjetas de estadísticas */
        .talent-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(15, 15, 30, 0.7);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
        }

        .stat-card .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
        }

        .stat-card .stat-label {
            color: #94A3B8;
            font-size: 0.85rem;
            margin-top: 0.3rem;
        }

        .stat-pending .stat-number { color: var(--talent-warning); }
        .stat-reviewing .stat-number { color: var(--talent-info); }
        .stat-accepted .stat-number { color: var(--talent-success); }
        .stat-total .stat-number { color: var(--talent-primary); }

        /* Filtros */
        .talent-filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .talent-filters input,
        .talent-filters select {
            padding: 0.7rem 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: white;
            font-size: 0.9rem;
            flex: 1;
            min-width: 180px;
        }

        .talent-filters input::placeholder { color: #64748B; }

        /* Tabla de postulaciones */
        .talent-table-wrapper {
            background: rgba(15, 15, 30, 0.7);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            overflow: hidden;
        }

        .talent-table {
            width: 100%;
            border-collapse: collapse;
        }

        .talent-table th {
            background: rgba(59, 130, 246, 0.08);
            padding: 1rem;
            text-align: left;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94A3B8;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .talent-table td {
            padding: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 0.9rem;
            vertical-align: middle;
        }

        .talent-table tr:hover {
            background: rgba(59, 130, 246, 0.04);
        }

        /* Badges de estado */
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.15);
            color: #FBBF24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .status-reviewing {
            background: rgba(99, 102, 241, 0.15);
            color: #818CF8;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .status-accepted {
            background: rgba(34, 197, 94, 0.15);
            color: #4ADE80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-rejected {
            background: rgba(239, 68, 68, 0.15);
            color: #F87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        /* Botones de acción */
        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            margin: 2px;
        }

        .btn-download {
            background: rgba(59, 130, 246, 0.15);
            color: #60A5FA;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .btn-download:hover {
            background: rgba(59, 130, 246, 0.3);
        }

        .btn-accept {
            background: rgba(34, 197, 94, 0.15);
            color: #4ADE80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .btn-accept:hover { background: rgba(34, 197, 94, 0.3); }

        .btn-reject {
            background: rgba(239, 68, 68, 0.15);
            color: #F87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-reject:hover { background: rgba(239, 68, 68, 0.3); }

        .btn-review {
            background: rgba(99, 102, 241, 0.15);
            color: #818CF8;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .btn-review:hover { background: rgba(99, 102, 241, 0.3); }

        /* Estado vacío */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #64748B;
        }

        .empty-state .emoji { font-size: 3rem; margin-bottom: 1rem; }

        /* Loading */
        .talent-loading {
            text-align: center;
            padding: 3rem;
            color: #64748B;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .talent-table-wrapper { overflow-x: auto; }
            .talent-table { min-width: 800px; }
            .talent-filters { flex-direction: column; }
            .talent-stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- HEADER SUPERIOR PROFESIONAL -->
        <header class="admin-header">
            <div class="header-left">
                <a href="admin.html" class="btn-back">
                    <i class="fas fa-arrow-left"></i>
                    <span>Volver al Panel</span>
                </a>
                <div class="title-group">
                    <h1>Winton <span class="accent">Talent</span></h1>
                    <p class="subtitle">Panel de Gestión de Candidatos</p>
                </div>
            </div>
            
            <div class="stats-overview">
                <div class="stat-card mini">
                    <span class="stat-label">Total</span>
                    <span class="stat-value" id="statTotal">0</span>
                </div>
                <div class="stat-card mini warning">
                    <span class="stat-label">Pendientes</span>
                    <span class="stat-value" id="statPending">0</span>
                </div>
                <div class="stat-card mini info">
                    <span class="stat-label">En Revisión</span>
                    <span class="stat-value" id="statReviewing">0</span>
                </div>
            </div>
        </header>

        <!-- FILTROS Y BÚSQUEDA -->
        <section class="controls-section card">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar por nombre, email o especialidad...">
            </div>
            <div class="filters-group">
                <select id="statusFilter" class="filter-select">
                    <option value="all">Todos los estados</option>
                    <option value="pending">Pendientes</option>
                    <option value="reviewing">En Revisión</option>
                    <option value="accepted">Aceptados</option>
                    <option value="rejected">Rechazados</option>
                </select>
                <select id="roleFilter" class="filter-select">
                    <option value="all">Todas las especialidades</option>
                    <option value="UI/UX Designer">UI/UX Designer</option>
                    <option value="Frontend Developer">Frontend Developer</option>
                    <option value="Backend Developer">Backend Developer</option>
                    <option value="Fullstack Developer">Fullstack Developer</option>
                    <option value="Marketing / Growth">Marketing / Growth</option>
                </select>
            </div>
        </section>

        <!-- TABLA DE POSTULACIONES -->
        <main class="table-section card">
            <div class="table-responsive">
                <table class="talent-table">
                    <thead>
                        <tr>
                            <th>PERFIL</th>
                            <th>CONTACTO / RRSS</th>
                            <th>ESPECIALIDAD</th>
                            <th>SALARIO PRETENDE</th>
                            <th>FECHA</th>
                            <th>ESTADO</th>
                            <th class="text-right">ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="talentTableBody">
                        <!-- Se llena dinámicamente -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        // ============================================================
        // LÓGICA DEL PANEL DE RECLUTAMIENTO ADMIN
        // ============================================================

        // Resolución de URL del Backend API (misma lógica que config.js)
        function getApiUrl() {
            const hostname = window.location.hostname;
            const isFileProtocol = window.location.protocol === 'file:';
            const isPrivateIp = /^10\.|^192\.168\.|^172\.(1[6-9]|2\d|3[0-1])\./.test(hostname);
            const isLocal = hostname === 'localhost' || hostname === '127.0.0.1' || isPrivateIp || isFileProtocol;
            if (isFileProtocol) return 'http://localhost:3000';
            if (isLocal) return `http://${hostname}:3000`;
            if (hostname.startsWith('demo.') || hostname.includes('demo.')) {
                return 'https://wintoncoin-backend-demo.onrender.com';
            }
            return 'https://wintoncoin-backend.onrender.com';
        }

        const API_URL = getApiUrl();

        // ============================================================
        // AUTENTICACIÓN POR COOKIES (igual que admin-panel.js)
        // ============================================================
        // El admin panel usa cookies httpOnly gestionadas por el backend.
        // No usamos localStorage ni Bearer tokens.
        // Si la cookie no existe o expiró, el backend responde 401
        // y redirigimos a admin.html (login).

        // Función segura para peticiones autenticadas (igual que apiFetch en admin-panel.js)
        async function apiFetch(endpoint) {
            const response = await fetch(`${API_URL}${endpoint}`, {
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include' // Envía las cookies httpOnly automáticamente
            });

            // Si no está autenticado, redirigir al login
            if (response.status === 401 || response.status === 403) {
                window.location.href = 'admin.html';
                throw new Error('Sesión expirada.');
            }

            return response.json();
        }

        // Función para peticiones con body (PATCH, POST)
        async function apiFetchWithBody(endpoint, method, body) {
            const response = await fetch(`${API_URL}${endpoint}`, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include', // Cookies httpOnly
                body: JSON.stringify(body)
            });

            if (response.status === 401 || response.status === 403) {
                window.location.href = 'admin.html';
                throw new Error('Sesión expirada.');
            }

            return response.json();
        }

        // Elementos del DOM
        const tableBody = document.getElementById('talentTableBody');
        const searchInput = document.getElementById('searchInput');
        const statusFilter = document.getElementById('statusFilter');
        const roleFilter = document.getElementById('roleFilter');

        // Cargar postulaciones
        async function loadProposals() {
            try {
                const params = new URLSearchParams();
                const status = statusFilter.value;
                const role = roleFilter.value;
                const search = searchInput.value.trim();

                if (status !== 'all') params.set('status', status);
                if (role !== 'all') params.set('role', role);
                if (search) params.set('search', search);

                const data = await apiFetch(`/api/recruitment/admin/list?${params.toString()}`);

                if (!data.success) throw new Error(data.message);

                renderTable(data.proposals);
                updateStats(data.proposals);
            } catch (error) {
                tableBody.innerHTML = `<tr><td colspan="7" class="empty-state">
                    <div class="emoji">⚠️</div>
                    <p>Error al cargar: ${error.message}</p>
                </td></tr>`;
            }
        }

        // Renderizar tabla con toda la información
        function renderTable(proposals) {
            if (proposals.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="7" class="empty-state">
                    <div class="emoji">📭</div>
                    <p>No hay postulaciones con estos filtros.</p>
                </td></tr>`;
                return;
            }

            tableBody.innerHTML = proposals.map(p => {
                const date = new Date(p.created_at).toLocaleDateString('es-ES', {
                    day: '2-digit', month: 'short', year: 'numeric'
                });

                return `
                    <tr class="talent-row">
                        <td>
                            <div class="talent-profile">
                                <div class="avatar">${p.full_name.charAt(0)}</div>
                                <div class="info">
                                    <span class="name">${escapeHtml(p.full_name)}</span>
                                    <span class="id">ID: #${p.id}</span>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div class="contact-info">
                                <span class="email"><i class="far fa-envelope"></i> ${escapeHtml(p.email)}</span>
                                ${p.linkedin_url ? `<a href="${escapeHtml(p.linkedin_url)}" target="_blank" class="linkedin-link"><i class="fab fa-linkedin"></i> LinkedIn ↗</a>` : '<span class="no-link">Sin LinkedIn</span>'}
                            </div>
                        </td>
                        <td><span class="badge role">${escapeHtml(p.role)}</span></td>
                        <td><span class="salary-text highlight">${p.expected_salary ? `$ ${escapeHtml(p.expected_salary)}` : 'N/A'}</span></td>
                        <td><span class="date">${date}</span></td>
                        <td><span class="status-btn ${p.status}">${p.status.toUpperCase()}</span></td>
                        <td class="text-right">
                            <div class="actions">
                                <button onclick="downloadCV('${p.cv_filename}')" class="btn-action cv" title="Descargar CV">
                                    <i class="fas fa-file-pdf"></i> CV
                                </button>
                                ${p.status === 'pending' ? `
                                    <button onclick="updateStatus(${p.id}, 'reviewing')" class="btn-action review" title="Revisar">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                ` : ''}
                                ${['pending', 'reviewing'].includes(p.status) ? `
                                    <button onclick="updateStatus(${p.id}, 'accepted')" class="btn-action accept" title="Aceptar">
                                        <i class="fas fa-check"></i>
                                    </button>
                                    <button onclick="updateStatus(${p.id}, 'rejected')" class="btn-action reject" title="Rechazar">
                                        <i class="fas fa-times"></i>
                                    </button>
                                ` : ''}
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Actualizar estadísticas de forma eficiente
        function updateStats(proposals) {
            // Usamos los datos actuales para evitar doble petición si es posible
            const total = proposals.length;
            const pending = proposals.filter(p => p.status === 'pending').length;
            const reviewing = proposals.filter(p => p.status === 'reviewing').length;
            
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statPending').textContent = pending;
            document.getElementById('statReviewing').textContent = reviewing;
        }

        // Actualizar estado de una postulación
        async function updateStatus(id, newStatus) {
            const notes = newStatus === 'rejected'
                ? prompt('¿Motivo del rechazo? (opcional):')
                : null;

            try {
                const data = await apiFetchWithBody(`/api/recruitment/admin/${id}/status`, 'PATCH', { status: newStatus, notes });
                if (data.success) {
                    loadProposals(); // Recargar tabla
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                alert('Error de conexión: ' + error.message);
            }
        }

        // Descargar CV
        function downloadCV(filename) {
            window.open(`${API_URL}/api/recruitment/admin/download/${filename}`, '_blank');
        }

        // Sanitización XSS
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Eventos de filtros
        searchInput.addEventListener('input', debounce(loadProposals, 400));
        statusFilter.addEventListener('change', loadProposals);
        roleFilter.addEventListener('change', loadProposals);

        // Debounce para evitar peticiones excesivas
        function debounce(fn, ms) {
            let timer;
            return function(...args) {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), ms);
            };
        }

        // Carga inicial
        loadProposals();
    </script>
</body>
</html>
