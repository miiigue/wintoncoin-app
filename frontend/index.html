<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Interfaz Smart Contract</title>
    <link id="main-stylesheet" rel="stylesheet" href="style.css">
    <script>document.getElementById('main-stylesheet').href = `style.css?v=${new Date().getTime()}`;</script>
</head>
<body>
    <div class="container"> <!-- Contenedor para centrar y dar estilo -->
        <h1>Bienvenido</h1>
        <h2>Por favor, inicia sesión para continuar</h2>

        <form id="loginForm">
            <div>
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div>
                <button type="submit">Ingresar</button>
            </div>
        </form>

        <a href="register.html" class="secondary-action-button">Registrarse</a>
    </div>

    <script src="utils.js"></script>
    <script src="login.js"></script>

    <!-- Modal de Alerta Personalizado -->
    <div id="customAlertModal" class="modal">
        <div class="modal-content">
            <span class="close-button alert-close-button">&times;</span>
            <p id="customAlertMessage"></p>
            <button class="action-button alert-close-button">Cerrar</button>
        </div>
    </div>

    <!-- Modal de Advertencia de Cuenta Única -->
    <div id="oneAccountPolicyModal" class="modal policy-modal">
        <div class="modal-content">
            <span class="close-button policy-close-button">&times;</span>
            <h3>Aviso Importante</h3>
            <p>Para mantener nuestra comunidad justa, segura y libre de estafadores, te recordamos que solo se permite una cuenta por persona. ¡Gracias por tu colaboración!</p>
            <button class="action-button policy-close-button">Entendido</button>
        </div>
    </div>
</body>
</html>
