        <h1>Bienvenido</h1>

        <form id="loginForm">
            <div>
                <label for="identifier">Inicia sesión con tu Usuario o Email:</label>
                <input type="text" id="identifier" name="identifier"
                    placeholder="Tu nombre de usuario o correo electrónico" required autocomplete="username">
            </div>

            <div>
                <label for="password">Contraseña:</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                    <span class="password-toggle-icon" onclick="togglePasswordVisibility('password', this)">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"

                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </span>
                </div>
                <div style="text-align: right; margin-top: 6px;">
                    <a href="forgot-password.html" class="forgot-password-link">¿Olvidaste tu contraseña?</a>
                </div>
            </div>

            <div>
                <button type="submit">Ingresar</button>
            </div>
        </form>

        <a href="register.html" class="secondary-action-button">Registrarse</a>
