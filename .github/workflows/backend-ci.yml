name: Backend CI - Verificacion de modulos y pruebas

on:
  pull_request:
    branches:
      - main
      - demo
  push:
    branches:
      - main
      - demo
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'

jobs:
  backend-test:
    name: Pruebas Unitarias y Auditoria de Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: review070
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: wintoncoin_test
          PGDATA: /var/lib/postgresql/data/pg-review-070
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Clonar repositorio (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ Configurar entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm install --ignore-scripts

      - name: Ejecutar comprobaciones y pruebas del backend
        id: backend_checks
        env:
          DATABASE_URL: postgres://review070:postgrespassword@127.0.0.1:5432/wintoncoin_test
          PGPASSWORD: postgrespassword
          PG_REVIEW_PORT: 5432
          WINTON_MIGRATION_TEST_PORT: 5432
          JWT_SECRET: ci-test-secret-key-soc2-auditable
          ADMIN_SECRET_KEY: ci-test-admin-key-soc2
          ENCRYPTION_SECRET: ci-test-encryption-secret-32-chars-key
          OTP_SECRET: ci-test-otp-secret-key-soc2
          NODE_ENV: test
          IS_DEMO_ENV: 'true'
        run: |
          node verify_all_backend_imports.js
          node frontend/src/modules/tableSort.test.js
          npm run test:unit

      - name: 📋 Registro de Auditoria de Calidad (GitHub Step Summary)
        if: always()
        run: |
          echo "## 🛡️ Reporte de Integracion Continua Backend (WintonCoin FinTech)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.backend_checks.outcome }}" = "success" ]; then
            echo "- **Estado de la Suite**: Pruebas unitarias y verificacion de modulos ejecutados exitosamente (PASS)." >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Estado de la Suite**: Fallo o ejecucion incompleta en el pipeline (Comprobaciones: ${{ steps.backend_checks.outcome }}; trabajo: ${{ job.status }})." >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Alcance**: Verificacion automatizada; no constituye certificacion de seguridad." >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp UTC**: $(date -u)" >> $GITHUB_STEP_SUMMARY
